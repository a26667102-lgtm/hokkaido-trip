<title>宏宏宏旅行團｜北海道冬季旅遊</title>
<style>
:root{--bg:#FFFCF6;--ink:#3E3A39;--sub:#5f5957;--co:#F2A497;--ye:#F6D27A;--aq:#A8D3E6;--gr:#B9DAA5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--ink);font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.55;max-width:560px;padding-bottom:40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
header{position:relative;padding:16px 16px 0;text-align:center;background:var(--aq);overflow:hidden;border-bottom:3px solid var(--ink);border-radius:0 0 32px 32px}
header h1{font-size:30px;margin:0;font-weight:400}
header p{margin:4px 0 0;font-size:15px}
.plane{font-size:46px;display:inline-block;position:relative;z-index:0}
.plane::before{content:"\2601\FE0F";position:absolute;left:-10px;top:-12px;font-size:38px;z-index:-1}
.sm{position:absolute;left:14px;top:16px;font-size:32px}
.map{position:absolute;right:12px;top:14px;width:62px;height:auto}
.cd{margin:14px 0 0;border:3px solid var(--ink);border-radius:26px;padding:12px 10px;background:var(--bg)}
.cd .ttl{font-size:17px;margin-bottom:4px}
.cd .t{font-size:25px;line-height:1.3}
.cd .t span{font-size:15px;margin:0 6px 0 2px}
.cd .t i{font-style:normal;color:#E8836F}
.chs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chs span{border:3px solid var(--ink);border-radius:99px;padding:3px 12px;font-size:14px}
.chs span:nth-child(1){background:var(--co)}.chs span:nth-child(2){background:var(--ye)}.chs span:nth-child(3){background:var(--gr)}
.mt{display:block;width:calc(100% + 32px);margin:12px -16px 0;height:52px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:12px 14px}
nav button{flex:none;border:3px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 16px;font-size:16px;font-family:inherit}
nav button.on{background:var(--ye)}
main{padding:4px 14px}
section{display:none}section.on{display:block}
.card{background:var(--bg);border:3px solid var(--ink);border-radius:24px;padding:14px 16px;margin:14px 0}
.card.g{background:var(--gr)}.card.y{background:var(--ye)}.card.r{background:var(--co)}
.lab{font-size:13px}
.big{font-size:26px;margin:4px 0}
.card h3{margin:2px 0;font-size:18px;font-weight:400}
.sub{color:var(--sub);font-size:14px}
.tip{background:var(--bg);border:2px dashed var(--ink);border-radius:14px;padding:8px 12px;margin-top:8px;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px}
.chips button{flex:none;border:3px solid var(--ink);border-radius:99px;padding:5px 14px;font-family:inherit;font-size:14px;color:var(--ink)}
.chips button:not(.on){opacity:.5}
.tl{list-style:none;margin:8px 0 0;padding:0}
.tl li{display:flex;gap:12px;padding:9px 0;border-top:2px dashed var(--ink)}
.tl li:first-child{border-top:0}
.tl b{flex:none;width:50px;font-weight:400;font-variant-numeric:tabular-nums}
.todo{background:var(--co);border:2px solid var(--ink);border-radius:8px;padding:0 6px;font-size:12px;margin-left:4px;white-space:nowrap}
a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:15px}
label.ck input{width:20px;height:20px;margin-top:2px;accent-color:var(--co)}
.sh{font-size:24px;margin:16px 2px 0;font-weight:400}
.ph{width:100%;max-height:230px;object-fit:cover;border:3px solid var(--ink);border-radius:18px;margin:8px 0;display:block}
.eb{height:84px;border:3px solid var(--ink);border-radius:18px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:46px;letter-spacing:8px;margin-bottom:8px}
</style>
</head>
